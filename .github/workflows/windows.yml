name: Windows build

on:
  push:
  workflow_dispatch:

jobs:
  # Архив vpngramm для Windows 11 x64: лаунчер на Go, Java (Temurin 21) и приложение
  zip:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      # версия — из desktop/build.gradle.kts (appVersion)
      - name: Version
        id: ver
        run: echo "ver=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' desktop/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Build Windows archive
        run: ./gradlew :desktop:windowsZip --no-daemon
      # в артефакт кладём распакованную папку, чтобы при скачивании не было «архива в архиве»
      - name: Unpack for artifact
        run: |
          mkdir -p dist
          unzip -q out/vpngramm-${{ steps.ver.outputs.ver }}-windows-x64.zip -d dist
      - uses: actions/upload-artifact@v4
        with:
          name: vpngramm-${{ steps.ver.outputs.ver }}-windows-x64
          path: dist/vpngramm-${{ steps.ver.outputs.ver }}-windows-x64/
          if-no-files-found: error

  # Проверка на настоящей Windows: тесты (в том числе DPAPI) и пробный запуск vpngramm.exe
  windows:
    needs: zip
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tests on Windows
        run: ./gradlew :desktop:test --no-daemon
      - uses: actions/download-artifact@v4
        with:
          name: vpngramm-${{ needs.zip.outputs.ver }}-windows-x64
          path: app-dist
      - name: Launch vpngramm.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'appdata'
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $data = Join-Path $env:APPDATA 'vpngramm'
          New-Item -ItemType Directory -Force check | Out-Null

          Start-Process -FilePath (Resolve-Path 'app-dist\vpngramm.exe') -WorkingDirectory (Resolve-Path 'app-dist')
          Start-Sleep -Seconds 45

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save((Join-Path (Resolve-Path check) 'windows-run.png'))

          $java = Get-Process javaw -ErrorAction SilentlyContinue | Select-Object -First 1
          $failed = $false
          if (-not $java) { Write-Host 'FAIL: javaw is not running'; $failed = $true }
          else {
            Write-Host "javaw is running, window title: '$($java.MainWindowTitle)'"
            if ($java.MainWindowTitle -ne 'vpngramm') { Write-Host 'FAIL: no vpngramm window'; $failed = $true }
            # штатное закрытие окна: приложение должно сохранить настройки
            if ($java.CloseMainWindow()) { if (-not $java.WaitForExit(30000)) { Write-Host 'FAIL: did not exit after close'; $failed = $true } }
            else { Write-Host 'FAIL: CloseMainWindow returned false'; $failed = $true }
            Get-Process javaw -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          Get-ChildItem $data -ErrorAction SilentlyContinue | Format-Table Name, Length
          Copy-Item (Join-Path $data '*') check -ErrorAction SilentlyContinue
          if (Test-Path (Join-Path $data 'launcher.log')) { Write-Host '--- launcher.log'; Get-Content (Join-Path $data 'launcher.log') }
          if (Test-Path (Join-Path $data 'crash.txt')) { Write-Host 'FAIL: crash.txt'; Get-Content (Join-Path $data 'crash.txt'); $failed = $true }
          if (-not (Test-Path (Join-Path $data 'settings.properties'))) { Write-Host 'FAIL: settings were not saved on close'; $failed = $true }
          # секреты не должны попадать в снимок проверки
          Remove-Item (Join-Path (Resolve-Path check) 'secrets.properties') -ErrorAction SilentlyContinue
          if ($failed) { exit 1 }
          Write-Host 'OK: vpngramm.exe started, showed its window and saved settings on close'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check
          path: |
            check/
            desktop/build/screens/
            desktop/build/reports/tests/
          if-no-files-found: warn
